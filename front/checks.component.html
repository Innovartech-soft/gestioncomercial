<div class="row d-flex justify-content-center align-items-center" 
style="height: 30rem;" *ngIf="loading">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>
<div class="row" *ngIf="!loading" >
    <div class="card">
      <div class="card-body px-0">
        
        <div class="card">
          <div class="card-body row">
            <div class="row">
              <div class="col-2">
                <label for="serie">N° De Serie</label>
                <input class="form-control mt-1" name="serie" readonly
                type="number" [value]="selectedCheck? selectedCheck.serie : ''"/>
              </div>
              <div class="col-4">
                <label for="number">Número</label>
                <input class="form-control mt-1" name="number" type="number" readonly
                [value]="selectedCheck? selectedCheck.numero : ''"/>
              </div>
              <div class="col-6">
                <label for="bank">Banco</label>
                <input class="form-control mt-1" name="bank" type="text" readonly
                [value]="selectedCheck? selectedCheck.banco_emisor : ''"/>
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-6">
                <label for="titular">Titular Librador</label>
                <input class="form-control mt-1" name="titular" type="text" readonly
                [value]="selectedCheck? selectedCheck.titular_librador : ''"/>
              </div>
              <div class="col-6">
                <label for="date">Fecha De Emisión</label>
                <div class="input-group">
                  <input class="form-control" readonly placeholder="dd/mm/aaaa"
                      name="dp" [value]="selectedCheck? selectedCheck.fechaEmisionToShow : ''">
                  <button class="input-group-text" disabled type="button">
                    <i class="feather icon-calendar icon-md text-muted"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-6">
                <label for="client">Cliente</label>
                <input class="form-control mt-1" name="client" type="text" readonly
                [value]="selectedCheck? selectedCheck.nombre_cliente : ''"/>
              </div>
              <div class="col-6">
                <label for="date">Importe</label>
                <div class="input-group mt-1">
                  <button class="input-group-text" disabled type="button">
                    <p>$</p>
                  </button>
                  <input class="form-control" name="date" type="number" readonly
                  [value]="selectedCheck? selectedCheck.importe : ''"/>
                </div>
              </div>
            </div>
          </div> 
        </div>
        
        <div class="mt-4">
          <div class="modal-secondary-bg d-flex justify-content-start modal-header">
              <h5 class="modal-title text-white" id="exampleModalLabel">Listado</h5>
          </div>
        </div>

        <div class="d-flex justify-content-center mt-4" *ngIf="cheques.length == 0">
            No se encuentran cheques activos del cliente {{clientName}}.
        </div>
        <div class="table-responsive mt-4" *ngIf="cheques.length > 0">

          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>NUMERO</th>
                  <th>CLIENTE</th>
                  <th>FECHA PAGO</th>
                  <th>FECHA EMISION</th>
                  <th>IMPORTE</th>
                  <th>ACCIONES</th>
                </tr>
              </thead>
              <tbody>
                <tr [ngClass]="{'selectedCheck': cheque.selected}" *ngFor="let cheque of cheques">
                  <td>{{ cheque.numero }}</td>
                  <td>{{ cheque.nombre_cliente }}</td>
                  <td>{{ cheque.fechaPagoToShow }}</td>
                  <td>{{ cheque.fechaEmisionToShow }}</td>
                  <td>${{ cheque.importe }}</td>
                  <td>
                    <button *ngIf="!cheque.selected" class="btn btn-success btn-icon mx-1" (click)="seleccionarCheque(cheque)">
                      <i class="feather icon-plus"></i>
                    </button>
                    <button *ngIf="cheque.selected" class="btn btn-danger btn-icon mx-1" (click)="deseleccionarCheque(cheque)">
                      <i class="feather icon-x"></i>
                    </button>
                    <button class="btn btn-primary btn-icon" (click)="verDetalleCheque(cheque)">
                      <i class="feather icon-eye"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
        
    </div>
</div>
